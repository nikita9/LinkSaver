name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run pack
      - name: Verify packaged application
        shell: bash
        run: |
          test -n "$(find dist -name app.asar -print -quit)"
          test -n "$(find dist -path '*better-sqlite3*' -name '*.node' -print -quit)"
