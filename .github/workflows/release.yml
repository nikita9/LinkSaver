name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Rebuilds better-sqlite3 against Electron's ABI for this runner's
      # platform. This is why each target builds on its own native runner.
      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI: produce unsigned builds rather than failing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the native SQLite module was bundled
        shell: bash
        run: |
          found=$(find dist -name 'better_sqlite3.node' | head -1)
          if [ -z "$found" ]; then
            echo "::warning::better_sqlite3.node not found in dist — the app will fall back to JSON storage"
          else
            echo "bundled native module: $found"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: find artifacts -type f -printf '%10s  %p\n' | sort -k2

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $(find artifacts -type f) --clobber
          else
            gh release create "$TAG" $(find artifacts -type f) \
              --title "$TAG" \
              --generate-notes
          fi
