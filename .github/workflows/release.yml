name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Rebuilds better-sqlite3 against Electron's ABI for this runner's
      # platform. This is why each target builds on its own native runner.
      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI: produce unsigned builds rather than failing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the native SQLite module was bundled
        shell: bash
        run: |
          # The .node either sits loose on disk (when asarUnpack applies) or
          # is packed inside app.asar. Check both before warning.
          loose=$(find dist -name 'better_sqlite3.node' | head -1)
          packed=""
          while IFS= read -r asar; do
            if grep -q 'better_sqlite3.node' "$asar" 2>/dev/null; then packed="$asar"; break; fi
          done < <(find dist -name 'app.asar')

          if [ -n "$loose" ]; then
            echo "native module (unpacked): $loose"
          elif [ -n "$packed" ]; then
            echo "native module (inside asar): $packed"
          else
            echo "::warning::better-sqlite3 not bundled — the app will fall back to JSON storage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: find artifacts -type f -printf '%10s  %p\n' | sort -k2

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Artifact names contain spaces ("Link Saver Setup 2.0.0.exe"), so
          # pass them NUL-delimited rather than word-splitting a $(find ...).
          find artifacts -type f -print
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
